  <script>
    // No-flash theme bootstrap. Reads localStorage.theme (auto | light | dark)
    // and writes data-theme on <html> before paint so dark mode never flashes light.
    (function () {
      try {
        var saved = localStorage.getItem('portfolio-theme');
        var pref = saved === 'light' || saved === 'dark' || saved === 'auto' ? saved : 'auto';
        var resolved = pref === 'auto'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : pref;
        document.documentElement.setAttribute('data-theme', resolved);
        document.documentElement.setAttribute('data-theme-pref', pref);
      } catch (_) {
        document.documentElement.setAttribute('data-theme', 'light');
        document.documentElement.setAttribute('data-theme-pref', 'auto');
      }
    })();
  </script>
